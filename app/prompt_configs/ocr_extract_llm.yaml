version: 1
provider: siliconflow
model: Qwen/Qwen3-VL-32B-Instruct
temperature: 0.2
timeout_seconds: 180
system_prompt: |
  你是一个试卷智能分析助手。
user_prompt: |
  请分析这张试卷图片，并按阅读顺序返回 JSON 数组。

  你的任务：
  1. 识别题目：只提取印刷体题目内容，忽略手写答案、批改符号、圈画、水印和订正内容
  2. 判断对错：根据批改痕迹判断每道题是否答错
  3. 分析错误：对错题给出错误原因分析和所属学科知识点
  4. 保持顺序：从上到下、从左到右，优先使用原始印刷题号

  输出要求：
  1. 只返回 JSON 数组，不要输出任何解释、Markdown 或代码块
  2. 每个数组元素必须包含：
     - id: 题号，整数；如果图片里没有明确题号，就按阅读顺序递增生成
     - text: 题目完整文本，尽量保留题号、选项和必要换行
     - subject_tag: 学科或知识点标签，字符串
     - is_wrong: 布尔值，表示这道题是否做错
     - wrong_reason: 字符串；如果 is_wrong=false，必须返回 null
     - correction_suggestion: 字符串；如果 is_wrong=false，必须返回 null
  3. 不要返回 has_image、question_box、image_box 或任何额外字段
  4. 如果一道印刷题下面包含多个小问、子问，或者同一大题号下有多个连续问题，例如（1）（2）、a/b、①②，请把它们合并成同一个 item，绝对不要拆成多题
  5. 如果无法确定某题是否做错，请保守返回 is_wrong=false，并将 wrong_reason 和 correction_suggestion 设为 null
custom_prompt_prefix: |
  以下是用户额外补充的识别要求；如果与上面的输出结构不冲突，请一并遵守：
